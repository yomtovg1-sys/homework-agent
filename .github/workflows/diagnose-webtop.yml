name: Diagnose Webtop login page

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check which Webtop endpoints are reachable
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          curl -s https://ipinfo.io/country; echo
          for u in https://www.webtop.co.il/ https://www.webtop.co.il/mobilev2/ https://www.webtop.co.il/v2/ \
                   https://webtopserver.smartschool.co.il/server/api/user/LoginByUserNameAndPassword \
                   https://www.smartschool.co.il/ https://web.mashov.info/; do
            echo "$u -> $(curl -s -o /dev/null -A "$UA" -w '%{http_code} %{redirect_url}' -m 20 "$u")"
          done
